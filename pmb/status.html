<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cek status pendaftaran mahasiswa baru FAST USTEDI menggunakan NIK dan email." />
  <meta name="theme-color" content="#0d3b8c" />
  <title>Cek Status Pendaftaran — PMB FAST USTEDI</title>
  <link rel="icon" href="/assets/img/logo-fast.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/fast.css?v=20260218" />
  <link rel="stylesheet" href="/assets/css/berita.css?v=20260218" />
  <link rel="stylesheet" href="/assets/css/pmb.css?v=20260218" />
</head>
<body>

  <div id="fast-header"></div>

  <header class="kepala-halaman">
    <div class="wadah">
      <p class="jejak"><a href="/">Portal FAST</a> › <a href="/pmb/">PMB</a> › Status</p>
      <h1>📋 Cek Status Pendaftaran</h1>
      <p>Masukkan NIK dan email yang kamu gunakan saat mendaftar untuk melihat data pendaftaranmu.</p>
    </div>
  </header>

  <main class="bagian">
    <div class="wadah">
      <div class="kartu-status">
        <div class="peringatan peringatan-info" id="statusPesan" hidden></div>
        <form id="statusForm" novalidate>
          <div class="form-grup">
            <label for="statusNik">NIK <span class="wajib">*</span></label>
            <input type="text" id="statusNik" inputmode="numeric" maxlength="16" placeholder="16 digit NIK" />
          </div>
          <div class="form-grup">
            <label for="statusEmail">Email <span class="wajib">*</span></label>
            <input type="email" id="statusEmail" placeholder="Email yang dipakai saat mendaftar" autocomplete="email" />
          </div>
          <button type="submit" class="btn btn-utama btn-blok mt-2">🔎 Cek Status</button>
        </form>
        <div id="statusHasil" class="mt-3"></div>
        <p class="catatan-aman mt-3" style="margin-bottom:0">
          <span aria-hidden="true">🔒</span>
          <span>Data hanya ditampilkan jika NIK dan email cocok. Jika ada kendala, hubungi panitia PMB melalui WhatsApp.</span>
        </p>
      </div>
      <p class="tengah mt-3">
        <a href="/pmb/" class="btn btn-garis">← Kembali ke PMB</a>
      </p>
    </div>
  </main>

  <div id="fast-footer"></div>

  <script>window.FAST_BASE = "/";</script>
  <script>window.FAST_PAGE = { modul: "pmb", nav: [{ label: "PMB", href: "/pmb/" }, { label: "Status", href: "/pmb/status.html" }, { label: "Daftar", href: "/pmb/#formulir", khusus: true }] };</script>
  <script src="/assets/js/config.js?v=20260218"></script>
  <script src="/assets/js/cms.js?v=20260218"></script>
  <script src="/assets/js/data.js?v=20260218"></script>
  <script src="/assets/js/auth.js?v=20260218"></script>
  <script src="/assets/js/ui.js?v=20260218"></script>
  <script src="/assets/js/pmb.js?v=20260218"></script>
</body>
</html>
