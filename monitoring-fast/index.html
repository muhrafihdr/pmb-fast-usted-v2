<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#071e42" />
  <title>Monitoring FAST — FAST USTEDI</title>
  <link rel="icon" href="/assets/img/logo-fast.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/monitoring-fast/style.css?v=20261122m" />
</head>
<body>

  <header class="mon-topbar">
    <a class="mon-brand" href="/" aria-label="Kembali ke Portal FAST USTEDI">
      <img src="/assets/img/logo-fast.png" alt="Logo FAST" />
      <span>
        <strong>Monitoring FAST</strong>
        <small>Fakultas Sains &amp; Teknologi USTEDI</small>
      </span>
    </a>

    <div class="mon-aksi">
      <button type="button" class="mon-btn" id="monReload" title="Muat ulang dashboard">
        <span aria-hidden="true">↻</span><span>Muat Ulang</span>
      </button>
      <button type="button" class="mon-btn" id="monFull" title="Tampilkan layar penuh">
        <span aria-hidden="true">⛶</span><span>Layar Penuh</span>
      </button>
      <a class="mon-btn mon-btn-portal" href="/">
        <span aria-hidden="true">←</span><span>Portal</span>
      </a>
    </div>
  </header>

  <main class="mon-area">
    <div class="mon-loading" id="monLoading">
      <span class="mon-spinner" aria-hidden="true"></span>
      <p>Memuat Monitoring FAST…</p>
    </div>
    <iframe id="monFrame" title="Monitoring FAST — FAST USTEDI"
            allow="fullscreen; clipboard-read; clipboard-write; autoplay"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>

  <script src="/assets/js/config.js?v=20261122m"></script>
  <script>
    (function () {
      "use strict";

      var CFG = window.FAST_CONFIG || {};
      var MON = CFG.monitoring || {};
      var APP = MON.appUrl ||
        "https://script.google.com/macros/s/AKfycbwWswpHsePmGHDAcorw5kSQwCrcqP5Y4PC4yAE71IAafFSbEqBuf-5pXqenXeObRAff9g/exec";
      var KUNCI_BUKA = "fast_monitoring_buka_v1";

      /* Halaman ini hanya boleh dibuka setelah lolos gerbang password
         di portal. Bila belum, kembalikan ke modal #monitoring. */
      var boleh = false;
      try {
        var sesi = JSON.parse(sessionStorage.getItem(KUNCI_BUKA) || "null");
        boleh = !!(sesi && sesi.exp && Date.now() <= sesi.exp);
        if (!boleh) sessionStorage.removeItem(KUNCI_BUKA);
      } catch (e) {
        boleh = false;
      }
      if (!boleh) {
        window.location.replace("/#monitoring");
        return;
      }

      var frame = document.getElementById("monFrame");
      var loading = document.getElementById("monLoading");

      frame.addEventListener("load", function () {
        /* Hapus overlay dari DOM (bukan sekadar disembunyikan) agar
           iframe lintas-origin dapat dilukis dengan benar. */
        if (loading && loading.parentNode) loading.parentNode.removeChild(loading);
      });
      frame.src = APP;

      /* Muat ulang isi dashboard tanpa memuat ulang halaman. */
      document.getElementById("monReload").addEventListener("click", function () {
        if (loading) loading.classList.remove("siap");
        frame.src = APP;
      });

      /* Tombol layar penuh. */
      document.getElementById("monFull").addEventListener("click", function () {
        var el = document.documentElement;
        if (!document.fullscreenElement) {
          var minta = el.requestFullscreen || el.webkitRequestFullscreen;
          if (minta) minta.call(el);
        } else {
          var keluar = document.exitFullscreen || document.webkitExitFullscreen;
          if (keluar) keluar.call(document);
        }
      });
    })();
  </script>
</body>
</html>
